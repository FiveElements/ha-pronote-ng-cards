<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 552" width="420" height="552" role="img" aria-label="La carte Agenda de Home Assistant en vue listWeek : la semaine en liste, groupée par jour, avec deux cours annulés préfixés d'une croix.">
  <title>Carte Agenda native, vue listWeek</title>
  <desc>Illustration synthétique. Rien n'y vient d'un élève réel : les dates, les horaires et les valeurs sont inventés, et les matières sont des matières de programme.</desc>

  <style>
    .bg { fill: #f2f4f7; }
    .card { fill: #ffffff; }
    .shadow { fill: #101828; opacity: .06; }
    .title { font: 400 23px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212121; }
    .range { font: 400 20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212121; }
    .nav { font: 400 20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212121; }
    .today { font: 400 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #03a9f4; }
    .day { font: 400 15.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212121; }
    .time { font: 400 13.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212121; }
    .subj { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212121; }
    .cross { font: 700 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e53935; }
    .rule { stroke: #e0e0e0; stroke-width: 1; }
    .dot { fill: #3f51b5; }
  </style>

  <rect class="bg" width="420" height="552"/>
  <g transform="translate(16 16)">
    <rect class="shadow" x="1" y="3" width="388" height="520" rx="12"/>
    <rect class="card" width="388" height="520" rx="12"/>

    <text class="title" x="22" y="40">Agenda de la semaine</text>
    <text class="range" x="22" y="76">12 – 18 janv. 2026</text>
    <text class="nav" x="330" y="76">‹</text>
    <text class="nav" x="360" y="76">›</text>

    <text class="today" x="22" y="117">Aujourd'hui</text>
    <rect x="232" y="96" width="134" height="32" rx="16" fill="#e1f5fe"/>
    <rect x="322" y="96" width="44" height="32" rx="16" fill="#03a9f4"/>
    <g fill="#0288d1">
      <rect x="247" y="106" width="6" height="6" rx="1"/><rect x="256" y="106" width="6" height="6" rx="1"/>
      <rect x="247" y="115" width="6" height="6" rx="1"/><rect x="256" y="115" width="6" height="6" rx="1"/>
      <rect x="288" y="106" width="22" height="5" rx="2"/><rect x="288" y="116" width="22" height="5" rx="2"/>
    </g>
    <g fill="#ffffff">
      <rect x="333" y="106" width="22" height="5" rx="2"/><rect x="333" y="116" width="15" height="5" rx="2"/>
    </g>
    <line class="rule" x1="22" y1="146" x2="366" y2="146"/>

    <text class="day" x="22" y="176">lundi</text>
    <text class="day" x="366" y="176" text-anchor="end">12 janvier 2026</text>
    <text class="time" x="22" y="210">08:30 - 09:30</text>
    <circle class="dot" cx="122" cy="206" r="5"/>
    <text class="subj" x="142" y="210">MATHEMATIQUES</text>
    <text class="time" x="22" y="250">09:30 - 10:30</text>
    <circle class="dot" cx="122" cy="246" r="5"/>
    <text class="cross" x="142" y="250">✕</text>
    <text class="subj" x="160" y="250">ANGLAIS LV1</text>
    <text class="time" x="22" y="290">10:30 - 11:30</text>
    <circle class="dot" cx="122" cy="286" r="5"/>
    <text class="subj" x="142" y="290">FRANCAIS</text>
    <line class="rule" x1="22" y1="310" x2="366" y2="310"/>

    <text class="day" x="22" y="340">mardi</text>
    <text class="day" x="366" y="340" text-anchor="end">13 janvier 2026</text>
    <text class="time" x="22" y="374">08:30 - 09:30</text>
    <circle class="dot" cx="122" cy="370" r="5"/>
    <text class="subj" x="142" y="374">HISTOIRE-GEOGRAPHIE</text>
    <text class="time" x="22" y="414">09:30 - 10:30</text>
    <circle class="dot" cx="122" cy="410" r="5"/>
    <text class="subj" x="142" y="414">PHYSIQUE-CHIMIE</text>
    <text class="time" x="22" y="454">10:30 - 11:30</text>
    <circle class="dot" cx="122" cy="450" r="5"/>
    <text class="subj" x="142" y="454">ARTS PLASTIQUES</text>
    <text class="time" x="22" y="494">14:00 - 15:00</text>
    <circle class="dot" cx="122" cy="490" r="5"/>
    <text class="cross" x="142" y="494">✕</text>
    <text class="subj" x="160" y="494">EDUCATION MUSICALE</text>
  </g>
</svg>
