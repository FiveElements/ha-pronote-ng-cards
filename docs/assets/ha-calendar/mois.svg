    .num { font: 400 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212121; }
    .out { font: 400 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #bdbdbd; }
