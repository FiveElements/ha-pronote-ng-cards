<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 210" width="372" height="210" role="img" aria-label="Aperçu de la carte Élève : nom, classe, état du jour et prochain cours.">
  <title>Carte Élève</title>
  <desc>Illustration synthétique. Rien n'y vient d'un élève réel : les dates, les horaires et les valeurs sont inventés, et les matières sont des matières de programme.</desc>

  <style>
    .bg { fill: #f2f4f7; }
    .card { fill: #ffffff; }
    .shadow { fill: #101828; opacity: .06; }
    .h { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #101828; }
    .p { font: 400 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #101828; }
    .s { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #667085; }
    .t { font: 400 12.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #667085; }
    .sect { font: 600 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #475467; letter-spacing: .04em; }
    .chip { font: 600 10.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .rule { stroke: #eaecf0; stroke-width: 1; }
    .strike { text-decoration: line-through; }
  </style>

  <rect class="bg" width="372" height="210"/>
  <g transform="translate(16 16)">
    <rect class="shadow" x="1" y="3" width="340" height="178" rx="12"/>
    <rect class="card" width="340" height="178" rx="12"/>
    <text class="h" x="18" y="26">Enfant Un</text>
    <text class="p" x="18" y="48">4e B</text>
    <line class="rule" x1="18" y1="58" x2="322" y2="58"/>
    <rect x="18" y="69" width="96" height="19" rx="9.5" fill="#ecfdf3"/>
    <text class="chip" x="25" y="82" fill="#027a48">Jour de classe</text>
    <rect x="122" y="69" width="120" height="19" rx="9.5" fill="#eaf3ff"/>
    <text class="chip" x="129" y="82" fill="#175cd3">Cours en ce moment</text>
    <text class="p" x="18" y="110">Prochain cours</text>
    <text class="s" x="18" y="126">Français · 10:30</text>
    <line class="rule" x1="18" y1="136" x2="322" y2="136"/>
    <text class="p" x="18" y="158">Période en cours</text>
    <text class="t" x="322" y="158" text-anchor="end">Trimestre 1</text>
  </g>
</svg>
