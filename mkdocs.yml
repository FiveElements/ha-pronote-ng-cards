site_name: Pronote NG — Cartes
site_url: https://fiveelements.github.io/ha-pronote-ng-cards/
repo_url: https://github.com/FiveElements/ha-pronote-ng-cards
theme:
  name: material
  language: fr
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Mode sombre }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Mode clair }
exclude_docs: |
  superpowers/
nav:
  - Accueil: index.md
  - Installation: installation.md
  - Cartes:
      - Élève: cartes/eleve.md
      - Prochain cours: cartes/prochain-cours.md
      - Emploi du temps: cartes/emploi-du-temps.md
      - Devoirs: cartes/devoirs.md
      - Notes: cartes/notes.md
      - Évaluations: cartes/evaluations.md
      - Cantine: cartes/menu.md
      - Vie scolaire: cartes/vie-scolaire.md
      - Limiteur: cartes/limiteur.md
  - Assembler un tableau de bord: tableaux-de-bord.md
  - Ce que ces cartes ne feront jamais: limites.md

# Une ancre morte est un avertissement, donc `mkdocs build --strict` echoue
# dessus. Sans ce bloc, mkdocs les signale au niveau INFO et la barriere Docs
# passe sans broncher : un sommaire dont la moitie des liens ne resolvent plus
# est un sommaire que personne ne relit. Le slugifieur par defaut retire les
# accents et les apostrophes -- `## Ce qui ne doit pas se faire` donne
# `#ce-qui-ne-doit-pas-se-faire`, et une ancre ecrite avec les accents ne
# resoudrait pas.
validation:
  anchors: warn
  links:
    unrecognized_links: warn
