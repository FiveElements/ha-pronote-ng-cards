site_name: Pronote NG — Cartes
site_url: https://fiveelements.github.io/ha-pronote-ng-cards/
repo_url: https://github.com/FiveElements/ha-pronote-ng-cards
theme:
  name: material
  language: fr
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Mode sombre }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Mode clair }
exclude_docs: |
  superpowers/

# Sans ce bloc, `admonition` n'est pas active -- le theme ne l'ajoute pas de
# lui-meme -- et les quatre encadres `!!! tip` / `!!! note` / `!!! warning` de
# `cartes/journee.md`, `cartes/emploi-du-temps.md` et `cartes/mode-collecte.md`
# sortaient en TEXTE BRUT sur Pages, les trois points d'exclamation compris.
#
# Mesure du 10 septembre 2026 sur la page publiee de la carte journee : deux
# marqueurs `!!!` visibles dans le texte rendu, zero element `.admonition`
# dans le document. Signale par la session de documentation, verifie sur le
# site avant d'y toucher -- une extension manquante ne casse rien, elle
# degrade en silence, et c'est le genre de defaut qu'on ne voit qu'en ouvrant
# la page publiee plutot que le depot.
markdown_extensions:
  - admonition
nav:
  - Accueil: index.md
  - Installation: installation.md
  - Cartes:
      - Élève: cartes/eleve.md
      - Prochain cours: cartes/prochain-cours.md
      - Vue journée: cartes/journee.md
      - Emploi du temps: cartes/emploi-du-temps.md
      - Devoirs: cartes/devoirs.md
      - Notes: cartes/notes.md
      - Évaluations: cartes/evaluations.md
      - Cantine: cartes/menu.md
      - Vie scolaire: cartes/vie-scolaire.md
      - Limiteur: cartes/limiteur.md
      - Mode de collecte: cartes/mode-collecte.md
  - Les couleurs de matière: couleurs-de-matiere.md
  - Avec l'agenda natif de Home Assistant: ha-calendar.md
  - Assembler un tableau de bord: tableaux-de-bord.md
  - Ce que ces cartes ne feront jamais: limites.md

# Une ancre morte est un avertissement, donc `mkdocs build --strict` echoue
# dessus. Sans ce bloc, mkdocs les signale au niveau INFO et la barriere Docs
# passe sans broncher : un sommaire dont la moitie des liens ne resolvent plus
# est un sommaire que personne ne relit. Le slugifieur par defaut retire les
# accents et les apostrophes -- `## Ce qui ne doit pas se faire` donne
# `#ce-qui-ne-doit-pas-se-faire`, et une ancre ecrite avec les accents ne
# resoudrait pas.
validation:
  anchors: warn
  links:
    unrecognized_links: warn
